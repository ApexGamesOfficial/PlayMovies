<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayMovies — Movies Anywhere, Everywhere</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <aside class="sidebar" id="sidebar">

        <a href="index.html" class="sidebar-logo">
            <img src="playmovies-logo.png" alt="PlayMovies">
        </a>

        <nav class="sidebar-nav">

            <a href="#" class="side-link active">
                <span class="side-icon">⌂</span>
                <span class="side-text">Home</span>
            </a>

            <button class="side-link" id="searchButton">
                <span class="side-icon">⌕</span>
                <span class="side-text">Search</span>
            </button>

            <a href="#" class="side-link">
                <span class="side-icon"></span>
                <span class="side-text">Movies</span>
            </a>

            <a href="#" class="side-link">
                <span class="side-icon"></span>
                <span class="side-text">TV Shows</span>
            </a>

            <a href="#" class="side-link">
                <span class="side-icon">＋</span>
                <span class="side-text">My List</span>
            </a>

            <a href="#" class="side-link">
                <span class="side-icon"></span>
                <span class="side-text">Store</span>
            </a>
<a href="subscriptions.html" class="side-link">
    <span class="side-icon">★</span>
    <span class="side-text">Subscriptions</span>
</a>
        </nav>

        <div class="sidebar-bottom">

            <a href="#" class="side-link">
                <span class="side-icon"></span>
                <span class="side-text">Profile</span>
            </a>

            <a href="#" class="side-link">
                <span class="side-icon"></span>
                <span class="side-text">Settings</span>
            </a>

        </div>

    </aside>


    <main class="main-content">

        <section class="hero">

            <div class="hero-overlay"></div>

            <div class="hero-content">

                <p class="featured-label">PLAYMOVIES FEATURED</p>

                <h1>Featured Movie</h1>

                <p class="movie-meta">
                    PG-13
                    <span>•</span>
                    2026
                    <span>•</span>
                    2h 8m
                </p>

                <p class="hero-description">
                    Discover new stories, popular favorites, and unforgettable
                    movies from anywhere, everywhere with PlayMovies.
                </p>

                <div class="hero-actions">

                    <button class="primary-action">
                        ▶ Watch Now
                    </button>

                    <button class="secondary-action">
                        More Info
                    </button>

                    <button class="circle-action">
                        +
                    </button>

                </div>

            </div>

        </section>


        <section class="content-row">

            <h2>Continue Watching</h2>

            <div class="movie-row">

                <button class="movie-card card-one">
                    <div class="card-content">
                        <span class="movie-title">Neon Run</span>
                        <span class="movie-details">48 min remaining</span>
                    </div>
                    <div class="progress">
                        <div class="progress-fill progress-60"></div>
                    </div>
                </button>

                <button class="movie-card card-two">
                    <div class="card-content">
                        <span class="movie-title">Afterlight</span>
                        <span class="movie-details">1h 12m remaining</span>
                    </div>
                    <div class="progress">
                        <div class="progress-fill progress-35"></div>
                    </div>
                </button>

                <button class="movie-card card-three">
                    <div class="card-content">
                        <span class="movie-title">The Last Signal</span>
                        <span class="movie-details">29 min remaining</span>
                    </div>
                    <div class="progress">
                        <div class="progress-fill progress-75"></div>
                    </div>
                </button>

            </div>

        </section>


        <section class="content-row">

            <h2>Trending Now</h2>

            <div class="movie-row">

                <button class="movie-card card-one">
                    <div class="card-content">
                        <span class="movie-title">Neon Run</span>
                        <span class="movie-details">2026 • PG-13</span>
                    </div>
                </button>

                <button class="movie-card card-two">
                    <div class="card-content">
                        <span class="movie-title">Afterlight</span>
                        <span class="movie-details">2026 • TV-14</span>
                    </div>
                </button>

                <button class="movie-card card-three">
                    <div class="card-content">
                        <span class="movie-title">The Last Signal</span>
                        <span class="movie-details">2025 • PG-13</span>
                    </div>
                </button>

                <button class="movie-card card-four">
                    <div class="card-content">
                        <span class="movie-title">Deep Horizon</span>
                        <span class="movie-details">2026 • PG</span>
                    </div>
                </button>

                <button class="movie-card card-five">
                    <div class="card-content">
                        <span class="movie-title">Static City</span>
                        <span class="movie-details">2025 • TV-14</span>
                    </div>
                </button>

            </div>

        </section>


        <section class="content-row">

            <h2>New Releases</h2>

            <div class="movie-row">

                <button class="movie-card card-six">
                    <div class="card-content">
                        <span class="movie-title">Zero Hour</span>
                        <span class="movie-details">2026 • PG-13</span>
                    </div>
                </button>

                <button class="movie-card card-seven">
                    <div class="card-content">
                        <span class="movie-title">Starfall</span>
                        <span class="movie-details">2026 • PG</span>
                    </div>
                </button>

                <button class="movie-card card-eight">
                    <div class="card-content">
                        <span class="movie-title">Redline</span>
                        <span class="movie-details">2026 • PG-13</span>
                    </div>
                </button>

                <button class="movie-card card-nine">
                    <div class="card-content">
                        <span class="movie-title">Night Shift</span>
                        <span class="movie-details">2026 • TV-14</span>
                    </div>
                </button>

                <button class="movie-card card-ten">
                    <div class="card-content">
                        <span class="movie-title">Beyond Earth</span>
                        <span class="movie-details">2026 • PG</span>
                    </div>
                </button>

            </div>

        </section>

    </main>


    <div class="search-panel" id="searchPanel">

        <div class="search-box">

            <input
                type="text"
                placeholder="Search movies and TV shows..."
                id="searchInput"
            >

            <button id="closeSearch">
                ✕
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
