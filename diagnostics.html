<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayMovies Diagnostics</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 25px;
            background: #050708;
            color: white;
            font-family: Arial, sans-serif;
        }

        .panel {
            width: min(800px, 100%);
            padding: 35px;
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 18px;
            background: #0c1012;
        }

        h1 {
            margin-top: 0;
        }

        .row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 16px 0;
            border-bottom: 1px solid rgba(255,255,255,.08);
        }

        .good {
            color: #27e5d4;
        }

        .bad {
            color: #ff8585;
        }

        button {
            width: 100%;
            min-height: 54px;
            margin-top: 18px;
            border: 0;
            border-radius: 8px;
            background: #27e5d4;
            color: #03100f;
            font-weight: 900;
            font-size: 16px;
            cursor: pointer;
        }

        #log {
            margin-top: 24px;
            padding: 18px;
            min-height: 90px;
            border-radius: 10px;
            background: #050708;
            color: #c8d0d4;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

<main class="panel">

    <h1>PlayMovies Diagnostics</h1>

    <div class="row">
        <span>Service Worker Support</span>
        <strong id="support">Checking...</strong>
    </div>

    <div class="row">
        <span>Registration Found</span>
        <strong id="registration">Checking...</strong>
    </div>

    <div class="row">
        <span>Page Controlled</span>
        <strong id="controlled">Checking...</strong>
    </div>

    <button id="registerButton">
        Register Service Worker Now
    </button>

    <button id="checkButton">
        Check Status Again
    </button>

    <div id="log">
        Waiting...
    </div>

</main>

<script>
const support = document.getElementById("support");
const registration = document.getElementById("registration");
const controlled = document.getElementById("controlled");
const log = document.getElementById("log");


async function checkStatus() {

    if (!("serviceWorker" in navigator)) {

        support.textContent = "NO";
        support.className = "bad";

        registration.textContent = "NO";
        registration.className = "bad";

        controlled.textContent = "NO";
        controlled.className = "bad";

        log.textContent =
            "This browser does not support Service Workers.";

        return;
    }


    support.textContent = "YES";
    support.className = "good";


    try {

        const reg =
            await navigator.serviceWorker.getRegistration(
                "/PlayMovies/"
            );


        if (reg) {

            registration.textContent = "YES";
            registration.className = "good";

            log.textContent =
                "Registration found.\n\n" +
                "Scope: " + reg.scope + "\n" +
                "Active: " +
                (reg.active ? reg.active.state : "No active worker");

        }

        else {

            registration.textContent = "NO";
            registration.className = "bad";

            log.textContent =
                "No PlayMovies Service Worker registration found.";

        }


        if (navigator.serviceWorker.controller) {

            controlled.textContent = "YES";
            controlled.className = "good";

        }

        else {

            controlled.textContent = "NO";
            controlled.className = "bad";

        }

    }

    catch (error) {

        log.textContent =
            "STATUS ERROR:\n\n" +
            error.name + "\n" +
            error.message;

    }

}


async function registerWorker() {

    log.textContent =
        "Trying to register service-worker.js...";


    try {

        const reg =
            await navigator.serviceWorker.register(
                "/PlayMovies/service-worker.js",
                {
                    scope: "/PlayMovies/"
                }
            );


        log.textContent =
            "REGISTER SUCCESS!\n\n" +
            "Scope: " + reg.scope + "\n\n" +
            "Refresh this page once.";

        await checkStatus();

    }

    catch (error) {

        log.textContent =
            "REGISTER FAILED:\n\n" +
            "Name: " + error.name + "\n\n" +
            "Message: " + error.message;

    }

}


document
    .getElementById("registerButton")
    .addEventListener(
        "click",
        registerWorker
    );


document
    .getElementById("checkButton")
    .addEventListener(
        "click",
        checkStatus
    );


checkStatus();
</script>

</body>
</html>
